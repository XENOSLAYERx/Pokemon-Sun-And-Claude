<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alola — Model Sheet</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%234a9eff'/%3E%3Cpath d='M2 16h28' stroke='%2305080f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2305080f'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #0c1320; color: #dfe8f5;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .label { position: absolute; font-size: 11px; letter-spacing: 0.04em; text-align: center;
        color: #cfe0f5; text-shadow: 0 1px 2px #000; }
      .label small { color: #7f9dc4; display: block; font-size: 9.5px; }
      .label.generic { color: #f0a070; }
      #bar { position: fixed; top: 10px; right: 12px; font-size: 12px; color: #9fb8d8;
        background: rgba(6,12,22,0.8); padding: 6px 10px; border-radius: 8px; }
      #bar a { color: #8fc4ff; margin-left: 8px; pointer-events: auto; }
    </style>
  </head>
  <body>
    <canvas id="sheet"></canvas>
    <div id="labels"></div>
    <div id="bar"></div>
    <script type="module" src="/src/model-sheet.ts"></script>
  </body>
</html>
